name: Build Android APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Phone APK (Debug & Release)
        run: ./gradlew :phone-app:assembleDebug :phone-app:assembleRelease --stacktrace

      - name: Build Watch APK (Debug & Release)
        run: ./gradlew :watch-app:assembleDebug :watch-app:assembleRelease --stacktrace

      - name: Upload Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-app-apks
          path: phone-app/build/outputs/apk/**/*.apk

      - name: Upload Watch APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-app-apks
          path: watch-app/build/outputs/apk/**/*.apk
